<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Standalone Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: #fafafa;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    #status { font-size: 14px; letter-spacing: 0.2em; color: #111; text-transform: uppercase; text-align: center; }
    .questionnaire { max-width: 560px; width: 100%; }
    .q-title { font-size: 11px; letter-spacing: 0.3em; color: #111; text-transform: uppercase; margin-bottom: 0.5rem; }
    .q-instruction { font-size: 13px; color: #222; margin-bottom: 2rem; line-height: 1.6; }
    .question-block { margin-bottom: 2.5rem; }
    .question-text { font-size: 17px; line-height: 1.5; margin-bottom: 0.75rem; color: #111; }
    .scale { display: flex; gap: 5px; }
    .scale-btn {
      flex: 1; height: 52px; border: 1px solid #ccc; background: transparent;
      font-family: 'Courier New', monospace; font-size: 16px; cursor: pointer;
      transition: background 0.1s;
    }
    .scale-btn:hover { background: #f0f0f0; }
    .scale-btn.selected { background: #111; color: #fff; border-color: #111; }
    .scale-btn.disabled { opacity: 0.25; pointer-events: none; }
    .scale-labels { display: flex; justify-content: space-between; font-size: 10px; color: #222; margin-top: 4px; }
    .id-btn {
      width: 80px; height: 80px; border: 1px solid #ccc; background: transparent;
      font-family: 'Courier New', monospace; font-size: 22px; font-weight: bold;
      cursor: pointer; transition: background 0.1s;
    }
    .id-btn:hover { background: #f0f0f0; }
    .done-screen { text-align: center; }
    .done-screen p { font-size: 13px; letter-spacing: 0.2em; color: #111; text-transform: uppercase; }
    .text-input {
      width: 100%; border: none; border-bottom: 2px solid #ccc;
      font-family: "Courier New", monospace; font-size: 18px; padding: 8px 0;
      outline: none; background: transparent; color: #111;
      transition: border-color 0.2s;
    }
    .text-input:focus { border-color: #111; }
    .weiter-btn {
      margin-top: 1.25rem; padding: 12px 28px; border: 1px solid #111;
      background: #111; color: #fff; font-family: "Courier New", monospace;
      font-size: 13px; letter-spacing: 0.15em; cursor: pointer;
    }
    .weiter-btn:disabled { opacity: 0.3; cursor: default; }
    .option-btn {
      display: block; width: 100%; text-align: left; padding: 12px 16px;
      margin-bottom: 7px; border: 1px solid #ccc; background: transparent;
      font-family: "Courier New", monospace; font-size: 15px; cursor: pointer;
      transition: background 0.1s;
    }
    .option-btn:hover { background: #f0f0f0; }
    .option-btn.selected { background: #111; color: #fff; border-color: #111; }
  </style>
</head>
<body>

<div id="setup-screen" style="text-align:center;">
  <p style="font-size:13px;letter-spacing:0.3em;color:#111;text-transform:uppercase;margin-bottom:2rem;">Standalone Client</p>
  <p style="font-size:12px;color:#111;margin-bottom:0.5rem;letter-spacing:0.1em;">Dyaden-ID</p>
  <input id="sa-dyad-input" class="text-input" style="max-width:120px;text-align:center;font-size:28px;font-weight:bold;" maxlength="4" />
  <p style="font-size:12px;color:#111;margin:2rem 0 1rem;letter-spacing:0.1em;">Rolle wählen:</p>
  <div style="display:flex;gap:1rem;justify-content:center;">
    <button class="id-btn" onclick="saStart('A')">A</button>
    <button class="id-btn" onclick="saStart('B')">B</button>
  </div>
</div>

<div id="overview-screen" class="questionnaire" style="display:none;max-width:420px;">
  <p class="q-title" id="ov-title" style="margin-bottom:1.5rem;"></p>
  <div id="ov-list"></div>
  <div style="margin-top:2rem;display:flex;gap:0.75rem;">
    <button class="weiter-btn" style="flex:1;" onclick="saExport()">CSV exportieren</button>
    <button class="weiter-btn" style="flex:1;background:transparent;color:#c00;border-color:#c00;" onclick="saReset()">Zurücksetzen</button>
  </div>
</div>

<button id="abort-btn" onclick="saAbbrechen()" style="display:none;position:fixed;top:12px;right:12px;border:1px solid #ccc;background:#fff;font-family:'Courier New',monospace;font-size:13px;padding:6px 12px;cursor:pointer;z-index:10;">✕ Abbrechen</button>

<p id="status" style="display:none;">Warten...</p>

<script>
  // ══ STANDALONE-MODUS: kein Server, alles lokal ══════════

  let participantId = "";
  let triadId = "";

  const BASIS_FRAGEBOGEN = ["Demographie", "Attachment", "IRI"];

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Reihenfolge von Demographie/Attachment/IRI wird einmal pro Teilnehmer:in
  // zufällig festgelegt und dann dauerhaft gespeichert (übersteht Reload)
  function getBasisReihenfolge() {
    const gespeichert = localStorage.getItem("sa_basisreihenfolge");
    if (gespeichert) return JSON.parse(gespeichert);
    const neu = shuffle(BASIS_FRAGEBOGEN);
    localStorage.setItem("sa_basisreihenfolge", JSON.stringify(neu));
    return neu;
  }

  function baueSequenz() {
    return [
      ...getBasisReihenfolge(),
      "Testtrial 1", "Testtrial 2",
      ...Array.from({length: 16}, (_, i) => "Trial " + (i + 1))
    ];
  }

  let SEQUENZ = baueSequenz();

  // Fake-Socket: fängt die emits der Fragebögen ab und speichert lokal
  const socket = {
    on: function() {},
    emit: function(event, data) {
      if (event === "response") {
        saveRow({ ...data, event: "" });
      } else if (event === "fragebogen-fertig") {
        markComplete(data.fragebogen);
        saveRow({ dyad_id: triadId, participant: participantId, fragebogen: data.fragebogen, question: "", value: "", time: data.time, event: "fertig" });
        setTimeout(zeigeUebersicht, 80);
      }
    }
  };

  function lokalerZeitstempel(ms) {
    const d = ms ? new Date(ms) : new Date();
    const p = n => String(n).padStart(2, "0");
    return p(d.getDate()) + "." + p(d.getMonth()+1) + "." + d.getFullYear() + ", " +
           p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + "," + String(d.getMilliseconds()).padStart(3, "0");
  }

  function saveRow(row) {
    const rows = JSON.parse(localStorage.getItem("sa_responses") || "[]");
    rows.push({ ...row, server_timestamp: lokalerZeitstempel(row.time) });
    localStorage.setItem("sa_responses", JSON.stringify(rows));
  }

  function markComplete(name) {
    const done = JSON.parse(localStorage.getItem("sa_completed") || "{}");
    done[name] = true;
    localStorage.setItem("sa_completed", JSON.stringify(done));
  }

  function getCompleted() {
    return JSON.parse(localStorage.getItem("sa_completed") || "{}");
  }

  // ── Setup ──
  function saStart(rolle) {
    const val = document.getElementById("sa-dyad-input").value.trim();
    if (!val) { alert("Bitte Dyaden-ID eingeben."); return; }
    triadId = val;
    participantId = val + rolle;
    localStorage.setItem("sa_dyadId", triadId);
    localStorage.setItem("sa_participantId", participantId);
    SEQUENZ = baueSequenz();
    zeigeUebersicht();
  }

  // ── Übersicht ──
  function zeigeUebersicht() {
    clearScreen();
    document.getElementById("abort-btn").style.display = "none";
    const ov = document.getElementById("overview-screen");
    ov.style.display = "block";
    document.getElementById("ov-title").textContent = participantId;

    const list = document.getElementById("ov-list");
    list.innerHTML = "";
    const done = getCompleted();

    let vorherFertig = true; // erster Fragebogen ist immer freigeschaltet
    SEQUENZ.forEach(name => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = done[name] ? name + " ✓" : name;
      if (done[name]) {
        btn.style.borderColor = "#2a7";
        btn.style.color = "#2a7";
      }
      const freigeschaltet = vorherFertig || done[name];
      btn.disabled = !freigeschaltet;
      if (!freigeschaltet) btn.style.opacity = "0.3";
      btn.onclick = () => starteFragebogen(name);
      list.appendChild(btn);
      vorherFertig = !!done[name];
    });
  }

  function saAbbrechen() {
    if (confirm("Fragebogen abbrechen und zur Übersicht?")) zeigeUebersicht();
  }

  // ── Export: zwei Dateien — bereinigt (nur letzte Antwort) + Rohdaten (komplette Historie) ──
  function baueCSV(rows, cols) {
    const csvLines = [cols.join(",")];
    rows.forEach(r => {
      csvLines.push(cols.map(c => '"' + String(r[c] !== undefined ? r[c] : "").replace(/"/g, '""') + '"').join(","));
    });
    return csvLines.join("\n");
  }

  function bereinige(rows) {
    const letzte = new Map();
    const sonstige = [];
    rows.forEach(r => {
      const q = r.question;
      if (!q || q === "—") {
        sonstige.push(r);
      } else {
        const key = [r.dyad_id, r.participant, r.fragebogen, q].join("|");
        letzte.set(key, r);
      }
    });
    return [...sonstige, ...letzte.values()].sort((a, b) => (a.time || 0) - (b.time || 0));
  }

  function ladeDatei(inhalt, dateiname) {
    const blob = new Blob([inhalt], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = dateiname;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function saExport() {
    const rows = JSON.parse(localStorage.getItem("sa_responses") || "[]");
    if (rows.length === 0) { alert("Keine Daten vorhanden."); return; }
    const cols = ["dyad_id", "participant", "fragebogen", "question", "value", "time", "server_timestamp", "event"];
    const datum = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 16);
    const basisname = "standalone_" + (participantId || "unbekannt") + "_" + datum;

    const bereinigt = bereinige(rows);
    ladeDatei(baueCSV(bereinigt, cols), "export_" + basisname + ".csv");
    setTimeout(() => {
      ladeDatei(baueCSV(rows, cols), "rohdaten_" + basisname + ".csv");
    }, 400); // kleiner Abstand, damit der Browser beide Downloads zuverlässig auslöst
  }

  // ── Reset ──
  function saReset() {
    if (!confirm("Wirklich ALLE lokalen Daten löschen? (Antworten und Registrierung)")) return;
    if (!confirm("Sicher? Wurde vorher die CSV exportiert?")) return;
    localStorage.removeItem("sa_responses");
    localStorage.removeItem("sa_completed");
    localStorage.removeItem("sa_dyadId");
    localStorage.removeItem("sa_participantId");
    localStorage.removeItem("sa_basisreihenfolge");
    location.reload();
  }

  // ── Beim Laden: gespeicherte Registrierung wiederherstellen ──
  (function() {
    const savedP = localStorage.getItem("sa_participantId");
    const savedD = localStorage.getItem("sa_dyadId");
    if (savedP && savedD) {
      participantId = savedP;
      triadId = savedD;
    }
  })();

  // ── Wake Lock: Bildschirm anlassen ──
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (e) { /* z.B. Batteriesparmodus — kein Problem */ }
  }
  requestWakeLock();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") requestWakeLock();
  });

  // ── FRAGEBOGEN-DATEN ──────────────────────────────────

  const ATTACHMENT_FRAGEN = [
    { id: "att_1",  text: "Ich habe Angst, die Liebe meines Partners/meiner Partnerin zu verlieren." },
    { id: "att_2",  text: "Ich mache mir oft Sorgen, dass mein Partner/meine Partnerin nicht bei mir bleiben will." },
    { id: "att_3",  text: "Ich fühle mich wohl damit, meine privaten Gedanken und Gefühle mit meinem Partner/meiner Partnerin zu teilen." },
    { id: "att_4",  text: "Es fällt mir leicht, mich auf meinen Partner/meine Partnerin zu verlassen." },
    { id: "att_5",  text: "Ich befürchte, dass ich meinem Partner/meiner Partnerin weniger bedeute, als er/sie mir." },
    { id: "att_6",  text: "Ich ziehe es vor, meinem Partner/meiner Partnerin nicht nahe zu sein." },
    { id: "att_7",  text: "Mir wird unwohl, wenn ein Partner/eine Partnerin mir sehr nahe sein will." },
    { id: "att_8",  text: "Ich habe den Eindruck, dass mein Partner/meine Partnerin nicht so viel Nähe möchte wie ich." },
    { id: "att_9",  text: "Ich bespreche vieles mit meinem Partner/meiner Partnerin." },
    { id: "att_10", text: "Ich habe Angst, dass sobald ein Partner/eine Partnerin mich näher kennen lernt, er/sie mich nicht so mag, wie ich wirklich bin." },
    { id: "att_11", text: "Es macht mich wütend, dass ich von meinem Partner/meiner Partnerin nicht die Zuneigung und Unterstützung bekomme, die ich brauche." },
    { id: "att_12", text: "Es fällt mir leicht, meinem Partner/meiner Partnerin gegenüber liebevoll zu sein." }
  ];

  const IRI_FRAGEN = [
    { id: "iri_1",  text: "Ich empfinde warmherzige Gefühle für Leute, denen es weniger gut geht als mir." },
    { id: "iri_2",  text: "Die Gefühle einer Person in einem Roman kann ich mir sehr gut vorstellen." },
    { id: "iri_3",  text: "In Notfallsituationen fühle ich mich ängstlich und unbehaglich." },
    { id: "iri_4",  text: "Ich versuche, bei einem Streit zuerst beide Seiten zu verstehen, bevor ich eine Entscheidung treffe." },
    { id: "iri_5",  text: "Wenn ich sehe, wie jemand ausgenutzt wird, glaube ich, ihn schützen zu müssen." },
    { id: "iri_6",  text: "Ich fühle mich hilflos, wenn ich inmitten einer sehr emotionsgeladenen Situation bin." },
    { id: "iri_7",  text: "Nachdem ich einen Film gesehen habe, fühle ich mich so, als ob ich eine der Personen aus diesem Film sei." },
    { id: "iri_8",  text: "In einer gespannten emotionalen Situation zu sein, macht mir Angst." },
    { id: "iri_9",  text: "Mich berühren Dinge sehr, auch wenn ich sie nur beobachte." },
    { id: "iri_10", text: "Ich glaube, jedes Problem hat zwei Seiten und versuche deshalb beide zu berücksichtigen." },
    { id: "iri_11", text: "Ich würde mich selbst als eine ziemlich weichherzige Person bezeichnen." },
    { id: "iri_12", text: "Wenn ich einen guten Film sehe, kann ich mich sehr leicht in die Hauptperson hineinversetzen." },
    { id: "iri_13", text: "In heiklen Situationen neige ich dazu, die Kontrolle über mich zu verlieren." },
    { id: "iri_14", text: "Wenn mir das Verhalten eines anderen komisch vorkommt, versuche ich mich für eine Weile in seine Lage zu versetzen." },
    { id: "iri_15", text: "Wenn ich eine interessante Geschichte oder ein gutes Buch lese, versuche ich mir vorzustellen, wie ich mich fühlen würde, wenn mir die Ereignisse passieren würden." },
    { id: "iri_16", text: "Bevor ich jemanden kritisiere, versuche ich mir vorzustellen, wie ich mich an seiner Stelle fühlen würde." }
  ];

  // ── BEFEHLE EMPFANGEN ──────────────────────────────────

  function starteFragebogen(typeRaw) {
    const data = { type: typeRaw };
    document.getElementById("abort-btn").style.display = "block";
    const type = data.type.toUpperCase()
      .replace(/Ä/g, "A").replace(/ä/g, "A")
      .replace(/Ö/g, "O").replace(/ö/g, "O")
      .replace(/Ü/g, "U").replace(/ü/g, "U");

    clearScreen();

    if (type === "IRI") {
      zeigeFragen({
        titel: "IRI",
        anweisung: "Die folgenden Aussagen beschreiben, wie Sie auf verschiedene Situationen reagieren. Bitte geben Sie an, wie häufig die jeweilige Aussage auf Sie zutrifft.",
        fragen: IRI_FRAGEN,
        labelLinks: "nie",
        labelRechts: "immer",
        skala: 5,
        skalaBeschriftungen: ["nie", "selten", "manchmal", "oft", "immer"],
        fragebogen: "IRI"
      });
    } else if (type === "ATTACHMENT") {
      zeigeFragen({
        titel: "Attachment",
        anweisung: "Die folgenden Aussagen beziehen sich darauf, wie Sie sich in emotional bedeutsamen Partnerschaften fühlen. Bitte nehmen Sie zu jeder Aussage Stellung.",
        fragen: ATTACHMENT_FRAGEN,
        labelLinks: "stimme gar nicht zu",
        labelRechts: "stimme völlig zu",
        skala: 7,
        fragebogen: "Attachment"
      });
    } else if (type.startsWith("TRIAL") || type.startsWith("TESTTRIAL")) {
      zeigeTrialFragebogen(data.type);
    } else if (type === "RESET") {
      const aq = document.getElementById("active-questionnaire");
      if (aq) aq.remove();
      document.getElementById("status").style.display = "block";
    } else if (type === "DEMOGRAPHIE") {
      zeigeDemographie();
    }
  }

  // ── BILDSCHIRM LEEREN ──────────────────────────────────

  function clearScreen() {
    document.getElementById("status").style.display = "none";
    document.getElementById("setup-screen").style.display = "none";
    document.getElementById("overview-screen").style.display = "none";
    const old = document.getElementById("active-questionnaire");
    if (old) old.remove();
  }

  // ── SKALA-FRAGEBOGEN ANZEIGEN ──────────────────────────

  function zeigeFragen(config) {
    const wrapper = document.createElement("div");
    wrapper.className = "questionnaire";
    wrapper.id = "active-questionnaire";
    wrapper.dataset.total = config.fragen.length;
    wrapper.dataset.beantwortet = 0;
    wrapper.dataset.fragebogen = config.fragebogen;

    const titel = document.createElement("p");
    titel.className = "q-title";
    titel.textContent = config.titel;
    wrapper.appendChild(titel);

    const anweisung = document.createElement("p");
    anweisung.className = "q-instruction";
    anweisung.textContent = config.anweisung;
    wrapper.appendChild(anweisung);

    config.fragen.forEach((frage, fi) => {
      // Trennlinie für Block-Header
      if (frage.trennlinie) {
        const sep = document.createElement("p");
        sep.style.cssText = "font-size:11px;letter-spacing:0.2em;color:#111;text-transform:uppercase;margin:2rem 0 1rem;border-top:1px solid #ddd;padding-top:1rem;";
        sep.textContent = frage.text;
        wrapper.appendChild(sep);
        return;
      }

      const block = document.createElement("div");
      block.className = "question-block";
      block.id = "qblock-" + frage.id;

      const qt = document.createElement("p");
      qt.className = "question-text";
      qt.textContent = frage.text;
      block.appendChild(qt);

      const scale = document.createElement("div");
      scale.className = "scale";

      for (let i = 1; i <= config.skala; i++) {
        const btn = document.createElement("button");
        btn.className = "scale-btn";
        btn.textContent = i;
        if (config.skalaBeschriftungen) btn.title = config.skalaBeschriftungen[i-1] || "";
        btn.onclick = () => {
          // Deselect others
          scale.querySelectorAll(".scale-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          socket.emit("response", {
            dyad_id: triadId, participant: participantId,
            fragebogen: config.fragebogen, question: frage.id, value: i, time: Date.now()
          });
          // Count answered
          const prev = block.dataset.answered;
          if (!prev) {
            block.dataset.answered = "1";
            wrapper.dataset.beantwortet = String(parseInt(wrapper.dataset.beantwortet) + 1);
            checkAllAnswered(wrapper, config);
          }
        };
        scale.appendChild(btn);
      }
      block.appendChild(scale);

      if (config.labelLinks || config.labelRechts) {
        const labels = document.createElement("div");
        labels.className = "scale-labels";
        labels.innerHTML = `<span>${config.labelLinks || ""}</span><span>${config.labelRechts || ""}</span>`;
        block.appendChild(labels);
      }

      wrapper.appendChild(block);
    });

    document.body.appendChild(wrapper);
  }

  function checkAllAnswered(wrapper, config) {
    // Count only non-trennlinie items
    const realFragen = config.fragen.filter(f => !f.trennlinie);
    if (parseInt(wrapper.dataset.beantwortet) >= realFragen.length) {
      // Brief delay then show done
      setTimeout(() => {
        wrapper.remove();
        document.getElementById("status").style.display = "block";
        socket.emit("fragebogen-fertig", {
          dyad_id: triadId, participant: participantId,
          fragebogen: config.fragebogen, time: Date.now()
        });
      }, 600);
    }
  }

  // ── DEMOGRAPHIE ────────────────────────────────────────

  function zeigeDemographie() {
    clearScreen();

    const DEMO_FRAGEN = [
      {
        id: "demo_alter", typ: "text",
        frage: "Wie alt sind Sie?",
        placeholder: "Alter in Jahren"
      },
      {
        id: "demo_beruf", typ: "text",
        frage: "Welcher beruflichen Tätigkeit gehen Sie derzeit nach?",
        placeholder: "Beruf"
      },
      {
        id: "demo_abschluss", typ: "auswahl",
        frage: "Was ist Ihr höchster abgeschlossener Bildungsabschluss?",
        optionen: [
          "Kein Abschluss", "Schulabschluss", "Berufsausbildung",
          "Bachelor", "Master/Diplom", "Promotion", "Sonstiger Abschluss"
        ]
      },
      {
        id: "demo_bildungsjahre", typ: "text",
        frage: "Wie viele Jahre haben Sie insgesamt in formaler Ausbildung/Bildung verbracht?",
        placeholder: "Anzahl Jahre"
      },
      {
        id: "demo_einkommen", typ: "auswahl",
        frage: "Wie hoch ist Ihr monatliches Haushalts-Nettoeinkommen?",
        optionen: [
          "Unter 1.000 €", "1.000–1.999 €", "2.000–2.999 €",
          "3.000–3.999 €", "4.000–4.999 €", "5.000–5.999 €",
          "mehr als 6.000 €", "Möchte ich nicht angeben"
        ]
      },
      {
        id: "demo_einkommen_subj", typ: "auswahl",
        frage: "Wie gut kommen Sie mit Ihrem Haushalts-Einkommen aus?",
        optionen: [
          "Wir kommen überhaupt nicht aus", "Wir kommen eher schlecht aus",
          "Es reicht gerade so", "Wir kommen eher gut aus", "Wir kommen sehr gut aus"
        ]
      },
      {
        id: "demo_erwerbsstatus", typ: "auswahl",
        frage: "Wie ist Ihr derzeitiger Erwerbsstatus?",
        optionen: [
          "Vollzeit erwerbstätig", "Teilzeit erwerbstätig",
          "Selbstständig / freiberuflich tätig", "In Ausbildung / Studium",
          "Arbeitslos", "In Elternzeit", "In Rente / Pension",
          "Nicht erwerbstätig aus anderen Gründen"
        ]
      },
    ];

    let aktuelleIndex = 0;

    const wrapper = document.createElement("div");
    wrapper.className = "questionnaire";
    wrapper.id = "active-questionnaire";
    document.body.appendChild(wrapper);

    function sendeAntwort(id, wert) {
      socket.emit("response", {
        dyad_id: triadId, participant: participantId,
        fragebogen: "Demographie", question: id, value: wert, time: Date.now()
      });
    }

    function weiter(index) {
      if (index < DEMO_FRAGEN.length - 1) {
        aktuelleIndex = index + 1;
        zeigeFrage(aktuelleIndex);
      } else {
        document.getElementById("active-questionnaire").remove();
        document.getElementById("status").style.display = "block";
        socket.emit("fragebogen-fertig", {
          dyad_id: triadId, participant: participantId,
          fragebogen: "Demographie", time: Date.now()
        });
      }
    }

    function zeigeFrage(index) {
      const w = document.getElementById("active-questionnaire");
      w.innerHTML = "";

      const q = DEMO_FRAGEN[index];

      const titel = document.createElement("p");
      titel.className = "q-title";
      titel.textContent = "Demographische Daten — " + (index + 1) + " / " + DEMO_FRAGEN.length;
      w.appendChild(titel);

      const frage = document.createElement("p");
      frage.className = "question-text";
      frage.style.marginBottom = "1.25rem";
      frage.textContent = q.frage;
      w.appendChild(frage);

      if (q.typ === "text") {
        const input = document.createElement("input");
        input.type = "text";
        input.className = "text-input";
        input.placeholder = q.placeholder;
        w.appendChild(input);

        const fehler = document.createElement("p");
        fehler.style.cssText = "color:#c00;font-size:12px;margin-top:0.5rem;display:none;";
        fehler.textContent = "Bitte eine Antwort eingeben.";
        w.appendChild(fehler);

        const btn = document.createElement("button");
        btn.className = "weiter-btn";
        btn.textContent = index < DEMO_FRAGEN.length - 1 ? "Weiter →" : "Abschließen";
        btn.onclick = () => {
          const wert = input.value.trim();
          if (!wert) { fehler.style.display = "block"; input.focus(); return; }
          sendeAntwort(q.id, wert);
          weiter(index);
        };
        w.appendChild(btn);
        input.addEventListener("keydown", e => { if (e.key === "Enter") btn.click(); });
        input.addEventListener("input", () => { fehler.style.display = "none"; });
        setTimeout(() => input.focus(), 100);

      } else if (q.typ === "auswahl") {
        q.optionen.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = opt;
          btn.onclick = () => { sendeAntwort(q.id, opt); weiter(index); };
          w.appendChild(btn);
        });

      } else if (q.typ === "text_oder_keine_angabe") {
        const input = document.createElement("input");
        input.type = "text";
        input.className = "text-input";
        input.placeholder = q.placeholder;
        w.appendChild(input);

        const btn = document.createElement("button");
        btn.className = "weiter-btn";
        btn.textContent = index < DEMO_FRAGEN.length - 1 ? "Weiter →" : "Abschließen";
        btn.onclick = () => { sendeAntwort(q.id, input.value.trim() || "—"); weiter(index); };
        w.appendChild(btn);

        const keineBtn = document.createElement("button");
        keineBtn.className = "option-btn";
        keineBtn.style.marginTop = "0.75rem";
        keineBtn.textContent = q.keine_angabe;
        keineBtn.onclick = () => { sendeAntwort(q.id, q.keine_angabe); weiter(index); };
        w.appendChild(keineBtn);

        input.addEventListener("keydown", e => { if (e.key === "Enter") btn.click(); });
        setTimeout(() => input.focus(), 100);
      }
    }

    zeigeFrage(0);
  }

  // ── TRIAL FRAGEBOGEN ──────────────────────────────────

  function zeigeTrialFragebogen(trialName) {
    clearScreen();

    const wrapper = document.createElement("div");
    wrapper.className = "questionnaire";
    wrapper.id = "active-questionnaire";
    document.body.appendChild(wrapper);

    const titel = document.createElement("p");
    titel.className = "q-title";
    titel.textContent = trialName;
    wrapper.appendChild(titel);

    let antworten = {};
    let schritt = 0;

    function sendeAntwort(id, wert) {
      antworten[id] = wert;
      socket.emit("response", {
        dyad_id: triadId, participant: participantId,
        fragebogen: trialName, question: id, value: wert, time: Date.now()
      });
    }

    function weiterZuSchritt(n) {
      schritt = n;
      wrapper.innerHTML = "";

      const t = document.createElement("p");
      t.className = "q-title";
      t.textContent = trialName + " — " + (n + 1) + " / 5";
      wrapper.appendChild(t);

      if (n === 0) zeigeValenz();
      else if (n === 1) zeigeArousal();
      else if (n === 2) zeigeConnectedness();
      else if (n === 3) zeigeDominance();
      else if (n === 4) zeigeVorherBesprochen();
    }

    // ── Valenz (SAM, −4 bis 4, 9 Stufen, Bilder bei −4,−2,0,2,4) ──
    function zeigeValenz() {
      const frage = document.createElement("p");
      frage.className = "question-text";
      frage.textContent = "Wie haben Sie sich während der Interaktion gefühlt? (Stimmung)";
      wrapper.appendChild(frage);
      wrapper.appendChild(baueSAMSkala(SAM_VALENCE_IMGS, -4, 4, "negativ", "positiv", "val", () => weiterZuSchritt(1)));
    }

    // ── Arousal (SAM, 0 bis 8, 9 Stufen, Bilder bei 0,2,4,6,8) ──
    function zeigeArousal() {
      const frage = document.createElement("p");
      frage.className = "question-text";
      frage.textContent = "Wie aktiviert/erregt haben Sie sich gefühlt?";
      wrapper.appendChild(frage);
      wrapper.appendChild(baueSAMSkala(SAM_AROUSAL_IMGS, 0, 8, "ruhig", "erregt", "aro", () => weiterZuSchritt(2)));
    }

    // ── SAM Skala Builder ──
    // imgs: 5 Bilder für Positionen min, min+2, min+4, min+6, min+8
    function baueSAMSkala(imgs, min, max, labelL, labelR, id, onDone) {
      const container = document.createElement("div");

      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:flex-end;gap:0px;justify-content:center;margin:1rem 0 0.25rem;";

      for (let v = min; v <= max; v++) {
        const cell = document.createElement("div");
        cell.style.cssText = "display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer;";

        // Image only at even steps (min, min+2, min+4 ...)
        const imgEl = document.createElement("div");
        imgEl.style.cssText = "height:80px;display:flex;align-items:flex-end;justify-content:center;width:100%;";
        const isImgPos = (v - min) % 2 === 0;
        if (isImgPos) {
          const im = document.createElement("img");
          im.src = imgs[(v - min) / 2];
          im.style.cssText = "max-height:80px;max-width:100%;object-fit:contain;opacity:0.6;transition:opacity 0.15s;";
          im.id = "sam-img-" + id + "-" + v;
          imgEl.appendChild(im);
        }
        cell.appendChild(imgEl);

        const btn = document.createElement("button");
        btn.className = "scale-btn";
        btn.textContent = v;
        btn.id = "sam-btn-" + id + "-" + v;
        btn.style.cssText = "width:100%;height:44px;border:1px solid #ccc;background:transparent;font-family:'Courier New',monospace;font-size:14px;cursor:pointer;transition:background 0.1s;";
        btn.onclick = () => {
          for (let x = min; x <= max; x++) {
            const b = document.getElementById("sam-btn-" + id + "-" + x);
            const im = document.getElementById("sam-img-" + id + "-" + x);
            if (b) { b.style.background = "transparent"; b.style.color = "#111"; b.style.borderColor = "#ccc"; }
            if (im) im.style.opacity = "0.6";
          }
          btn.style.background = "#111";
          btn.style.color = "#fff";
          btn.style.borderColor = "#111";
          const selImg = document.getElementById("sam-img-" + id + "-" + v);
          if (selImg) selImg.style.opacity = "1";
          sendeAntwort(id, v);
          setTimeout(onDone, 400);
        };
        cell.appendChild(btn);
        row.appendChild(cell);
      }
      container.appendChild(row);

      const labels = document.createElement("div");
      labels.className = "scale-labels";
      labels.innerHTML = `<span>${labelL}</span><span>${labelR}</span>`;
      container.appendChild(labels);
      return container;
    }

    // ── Connectedness (0–8) ──
    function zeigeConnectedness() {
      const frage = document.createElement("p");
      frage.className = "question-text";
      frage.textContent = "Wie stark haben Sie sich mit Ihrem Gegenüber verbunden gefühlt?";
      wrapper.appendChild(frage);

      const scale = document.createElement("div");
      scale.className = "scale";
      for (let i = 0; i <= 8; i++) {
        const btn = document.createElement("button");
        btn.className = "scale-btn";
        btn.textContent = i;
        btn.onclick = () => {
          scale.querySelectorAll(".scale-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          sendeAntwort("connectedness", i);
          setTimeout(() => weiterZuSchritt(3), 400);
        };
        scale.appendChild(btn);
      }
      wrapper.appendChild(scale);
      const labels = document.createElement("div");
      labels.className = "scale-labels";
      labels.innerHTML = "<span>gar nicht</span><span>sehr stark</span>";
      wrapper.appendChild(labels);
    }

    // ── Dominance (−4 bis 4) ──
    function zeigeDominance() {
      const frage = document.createElement("p");
      frage.className = "question-text";
      frage.textContent = "Wer war während der Interaktion dominanter?";
      wrapper.appendChild(frage);

      const scale = document.createElement("div");
      scale.className = "scale";
      for (let i = -4; i <= 4; i++) {
        const btn = document.createElement("button");
        btn.className = "scale-btn";
        btn.textContent = i > 0 ? "+" + i : i;
        btn.onclick = () => {
          scale.querySelectorAll(".scale-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          sendeAntwort("dominance", i);
          setTimeout(() => weiterZuSchritt(4), 400);
        };
        scale.appendChild(btn);
      }
      wrapper.appendChild(scale);
      const labels = document.createElement("div");
      labels.className = "scale-labels";
      labels.innerHTML = "<span>Der/Die Andere</span><span>Ich</span>";
      wrapper.appendChild(labels);
    }

    // ── Vorher besprochen (Ja/Nein) ──
    function zeigeVorherBesprochen() {
      const frage = document.createElement("p");
      frage.className = "question-text";
      frage.textContent = "Haben Sie dieses Thema mit Ihrem Gegenüber schon einmal besprochen?";
      wrapper.appendChild(frage);

      ["Ja", "Nein"].forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = () => {
          sendeAntwort("vorher_besprochen", opt);
          // Done
          wrapper.remove();
          document.getElementById("status").style.display = "block";
          socket.emit("fragebogen-fertig", {
            dyad_id: triadId, participant: participantId,
            fragebogen: trialName, time: Date.now()
          });
        };
        wrapper.appendChild(btn);
      });
    }

    weiterZuSchritt(0);
  }

  // ── Start: Übersicht falls registriert, sonst Setup ──
  if (participantId) {
    zeigeUebersicht();
  }

</script>
